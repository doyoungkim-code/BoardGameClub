<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 앱 아이콘 원본. 여기서 PNG 아이콘들을 만든다 (npm run icons) -->
  <!-- 배경을 꽉 채워 두고 주사위는 가운데 안전 영역(80%) 안에 둔다: 안드로이드가 원·둥근사각형으로 잘라도 안 잘린다 -->
  <rect width="512" height="512" fill="#b45309"/>
  <g transform="rotate(-12 256 256)">
    <rect x="146" y="158" width="232" height="232" rx="48" fill="#78350f" opacity="0.35"/>
    <rect x="140" y="140" width="232" height="232" rx="48" fill="#fffbeb"/>
    <g fill="#78350f">
      <circle cx="198" cy="198" r="23"/>
      <circle cx="314" cy="198" r="23"/>
      <circle cx="256" cy="256" r="23"/>
      <circle cx="198" cy="314" r="23"/>
      <circle cx="314" cy="314" r="23"/>
    </g>
  </g>
</svg>
