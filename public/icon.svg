<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" shape-rendering="crispEdges">
  <!-- 픽셀 주사위 (32×32 칸, 한 칸 = 16px). 배경을 가득 채워 안드로이드 둥근 마스크로 잘려도 안전하고,
       주사위는 가운데 80% 원 안에 들어간다. 모든 앱 아이콘 PNG 의 원본 (npm run icons) -->
  <rect width="512" height="512" fill="#b45309"/>
  <!-- 그림자: 오른쪽 아래로 2칸 -->
  <g fill="#78350f" opacity="0.35">
    <rect x="160" y="144" width="256" height="16"/>
    <rect x="160" y="416" width="256" height="16"/>
    <rect x="144" y="160" width="288" height="256"/>
  </g>
  <!-- 테두리 (모서리 한 칸씩 깎음) -->
  <g fill="#78350f">
    <rect x="128" y="112" width="256" height="16"/>
    <rect x="128" y="384" width="256" height="16"/>
    <rect x="112" y="128" width="288" height="256"/>
  </g>
  <!-- 몸통 -->
  <g fill="#fffbeb">
    <rect x="144" y="128" width="224" height="16"/>
    <rect x="144" y="368" width="224" height="16"/>
    <rect x="128" y="144" width="256" height="224"/>
  </g>
  <!-- 눈 다섯 개 -->
  <g fill="#78350f">
    <rect x="144" y="144" width="64" height="64"/>
    <rect x="304" y="144" width="64" height="64"/>
    <rect x="224" y="224" width="64" height="64"/>
    <rect x="144" y="304" width="64" height="64"/>
    <rect x="304" y="304" width="64" height="64"/>
  </g>
</svg>
