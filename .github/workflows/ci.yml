name: CI

# 모든 push와 PR에서 린트·타입체크·빌드·보안 규칙 테스트를 돌린다.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Firestore 에뮬레이터 실행에 필요
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - run: npm run lint

      # Firebase 웹 설정값은 커밋된 .env.production 에서 읽는다
      - name: 타입체크 + 빌드
        run: npm run build

      - name: 보안 규칙 테스트
        run: npm run test:rules
