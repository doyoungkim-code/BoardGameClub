name: Deploy

# main 에 push 되면 린트·빌드·규칙 테스트를 다시 돌리고, 통과했을 때만 Hosting 에 배포한다.
#
# 보안 규칙·색인(firestore)은 여기서 배포하지 않는다.
# `firebase init hosting:github` 가 만든 서비스 계정에는 Hosting 권한만 있어서다.
# 규칙을 바꾸면 로컬에서 `npm run test:rules` 후 `npx firebase deploy --only firestore` 로 올린다.
on:
  push:
    branches: [main]
  # 실패했을 때 Actions 화면에서 수동으로 다시 돌릴 수 있게
  workflow_dispatch:

# 연달아 push 해도 마지막 것만 배포되게 한다
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - run: npm run lint

      # Firebase 웹 설정값은 커밋된 .env.production 에서 읽는다
      - name: 타입체크 + 빌드
        run: npm run build

      # 테스트가 실패하면 배포하지 않는다
      - name: 보안 규칙 테스트
        run: npm run test:rules

      # 시크릿 이름은 `firebase init hosting:github` 가 자동으로 등록하는 이름이다
      - name: Hosting 배포
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOYOU_BOARDGAME }}
          channelId: live
          projectId: doyou-boardgame
